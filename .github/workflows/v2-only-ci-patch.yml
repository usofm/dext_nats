name: V2 Only CI Patch

on:
  push:
    branches:
      - perf/parser-v2-cutover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0
      - name: Patch CI guards
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8-sig')
          replacements = [
              ("            Source/Internal/Dext.Net.Nats.Internal.ParserSelector.pas \\\n", ""),
              ("          grep -q 'TDextNatsSelectedFrameParser' Source/Internal/Dext.Net.Nats.Internal.ParserSelector.pas\n", ""),
              ("          grep -q 'DEXT_NATS_PARSER_V2' Source/Internal/Dext.Net.Nats.Internal.ParserSelector.pas\n", ""),
              ("          grep -q 'Dext.Net.Nats.ParserRuntime' Source/Dext.Net.Nats.pas\n", "          grep -q 'Dext.Net.Nats.ParserRuntime' Source/Dext.Net.Nats.pas\n          grep -q 'TDextNatsRuntimeFrameParser = TDextNatsFrameParserV2' Source/Dext.Net.Nats.ParserRuntime.pas\n          grep -q \"DEXT_NATS_RUNTIME_PARSER = 'v2'\" Source/Dext.Net.Nats.ParserRuntime.pas\n"),
              ("            Tests/Protocol/Dext.Net.Nats.ParserSelector.Tests.pas \\\n", ""),
              ("          grep -q 'TDextNatsParserSelectorTests' Tests/Dext.Net.Nats.Tests.dpr\n", ""),
              ("          grep -q 'ParserV1' scripts/build-tests.ps1\n", "          grep -q 'Parser=V2' scripts/build-tests.ps1\n"),
              ("          grep -q 'ParserV2' scripts/build-tests.ps1\n", ""),
              ("          grep -q 'Dext.Net.Nats.Internal.ParserSelector.pas' Tests/Dext.Net.Nats.Tests.dproj\n", "          grep -q 'Dext.Net.Nats.ParserRuntime.pas' Tests/Dext.Net.Nats.Tests.dproj\n"),
              ("          echo \"Full gate: scripts/validate-parser-cutover.ps1 -Config Release -Platform Win32 -LiveNats -Benchmark\"\n          echo \"V1 and V2 use isolated DCU/EXE output directories and Rebuild.\"\n          echo \"Merge remains gated on Delphi 13 compile + live NATS tests.\"\n", "          echo \"Full gate: scripts/validate-parser-cutover.ps1 -Config Release -Platform Win32 -LiveNats -Benchmark\"\n          echo \"Parser V2 is the only runtime parser; build uses a clean Rebuild.\"\n          echo \"Release remains gated on Delphi 13 compile + live NATS tests.\"\n")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected CI fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'Make CI enforce Parser V2 only'
          git push origin HEAD:perf/parser-v2-cutover
