name: Fix Cutover CI Guard Patch

on:
  push:
    branches:
      - perf/parser-v2-cutover

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0
      - name: Fix extracted gate class names
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8-sig')
          pairs = [
              (
                  "grep -q 'TDextNatsKeyValueWatcherGate' Source/KeyValue/Dext.Net.Nats.KeyValue.WatcherGate.pas",
                  "grep -q 'TDextNatsKeyValueWatchGate' Source/KeyValue/Dext.Net.Nats.KeyValue.WatcherGate.pas"
              ),
              (
                  "grep -q 'TDextNatsObjectStoreWatcherGate' Source/ObjectStore/Dext.Net.Nats.ObjectStore.WatcherGate.pas",
                  "grep -q 'TDextNatsObjectWatchGate' Source/ObjectStore/Dext.Net.Nats.ObjectStore.WatcherGate.pas"
              ),
          ]
          for old, new in pairs:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source guard {old!r}, got {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'Fix extracted class names in CI guard'
          git push origin HEAD:perf/parser-v2-cutover
