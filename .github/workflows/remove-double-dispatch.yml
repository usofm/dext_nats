name: Remove Double Dispatch Adapter

on:
  push:
    branches: [perf/parser-v2-cutover]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Remove obsolete opt-in dispatch adapter from Delphi graph
        shell: python
        run: |
          from pathlib import Path

          dpr = Path('Tests/Dext.Net.Nats.Tests.dpr')
          s = dpr.read_text(encoding='utf-8-sig')
          for frag in [
              "  Dext.Net.Nats.Dispatching in '..\\Source\\Dext.Net.Nats.Dispatching.pas',\n",
              "  Dext.Net.Nats.Dispatching.Tests in 'Core\\Dext.Net.Nats.Dispatching.Tests.pas',\n",
              "      TDextNatsDispatchingTests,\n",
          ]:
              if frag not in s:
                  raise SystemExit(f'Missing DPR dispatching fragment: {frag!r}')
              s = s.replace(frag, '', 1)
          dpr.write_text(s, encoding='utf-8-sig')

          dproj = Path('Tests/Dext.Net.Nats.Tests.dproj')
          s = dproj.read_text(encoding='utf-8-sig')
          for frag in [
              '<DCCReference Include="..\\Source\\Dext.Net.Nats.Dispatching.pas"/>',
              '<DCCReference Include="Core\\Dext.Net.Nats.Dispatching.Tests.pas"/>',
          ]:
              if frag not in s:
                  raise SystemExit(f'Missing DPROJ dispatching fragment: {frag!r}')
              s = s.replace(frag, '', 1)
          dproj.write_text(s, encoding='utf-8-sig')

      - name: Remove adapter files
        run: |
          git rm Source/Dext.Net.Nats.Dispatching.pas
          git rm Tests/Core/Dext.Net.Nats.Dispatching.Tests.pas

      - name: Enforce single dispatch architecture
        run: |
          ! test -f Source/Dext.Net.Nats.Dispatching.pas
          ! test -f Tests/Core/Dext.Net.Nats.Dispatching.Tests.pas
          ! grep -q 'Dext.Net.Nats.Dispatching' Tests/Dext.Net.Nats.Tests.dpr
          ! grep -q 'Dext.Net.Nats.Dispatching.pas' Tests/Dext.Net.Nats.Tests.dproj
          grep -q 'FHandlerDispatcher.Dispatch(item)' Source/Dext.Net.Nats.pas
          grep -q 'InlineDelivery: Boolean' Source/Dext.Net.Nats.pas

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/Dext.Net.Nats.Tests.dpr Tests/Dext.Net.Nats.Tests.dproj
          git commit -m 'Remove obsolete double-dispatch subscription adapter'
          git push origin HEAD:perf/parser-v2-cutover
