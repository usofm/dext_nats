name: Remove Parser Selector Patch

on:
  push:
    branches:
      - perf/parser-v2-cutover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0
      - name: Remove legacy selector references
        shell: python
        run: |
          from pathlib import Path

          dpr = Path('Tests/Dext.Net.Nats.Tests.dpr')
          s = dpr.read_text(encoding='utf-8-sig')
          fragments = [
              "  Dext.Net.Nats.Internal.ParserSelector in '..\\Source\\Internal\\Dext.Net.Nats.Internal.ParserSelector.pas',\n",
              "  Dext.Net.Nats.ParserSelector.Tests in 'Protocol\\Dext.Net.Nats.ParserSelector.Tests.pas',\n",
              "      TDextNatsParserSelectorTests,\n",
          ]
          for frag in fragments:
              if frag not in s:
                  raise SystemExit(f'Missing DPR fragment: {frag!r}')
              s = s.replace(frag, '', 1)
          dpr.write_text(s, encoding='utf-8-sig')

          dproj = Path('Tests/Dext.Net.Nats.Tests.dproj')
          s = dproj.read_text(encoding='utf-8-sig')
          fragments = [
              '<DCCReference Include="..\\Source\\Internal\\Dext.Net.Nats.Internal.ParserSelector.pas"/>',
              '<DCCReference Include="Protocol\\Dext.Net.Nats.ParserSelector.Tests.pas"/>',
          ]
          for frag in fragments:
              if frag not in s:
                  raise SystemExit(f'Missing DPROJ fragment: {frag!r}')
              s = s.replace(frag, '', 1)
          dproj.write_text(s, encoding='utf-8-sig')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/Dext.Net.Nats.Tests.dpr Tests/Dext.Net.Nats.Tests.dproj
          git commit -m 'Remove legacy parser selector from test graph'
          git push origin HEAD:perf/parser-v2-cutover
