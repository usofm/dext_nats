name: Delphi Build

on:
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
      platform:
        description: Delphi platform
        required: true
        default: Win32
        type: choice
        options:
          - Win32
          - Win64
      live_nats:
        description: Start local NATS + JetStream and require live integration tests
        required: true
        default: false
        type: boolean
      benchmark:
        description: Include explicit parser/throughput benchmarks
        required: true
        default: false
        type: boolean

jobs:
  build-test-both-parsers:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install NATS Server
        if: ${{ inputs.live_nats }}
        shell: powershell
        run: |
          $server = & .\scripts\download-nats-server.ps1
          if (-not $server) { throw 'NATS server download script returned no executable path.' }
          "DEXT_NATS_SERVER_EXE=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start NATS JetStream
        if: ${{ inputs.live_nats }}
        shell: powershell
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP 'dext-nats-js'
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $proc = Start-Process -FilePath $env:DEXT_NATS_SERVER_EXE -ArgumentList @('-js', '-sd', $dataDir, '-p', '4222') -PassThru
          "DEXT_NATS_SERVER_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 2
          if ($proc.HasExited) { throw "nats-server exited with code $($proc.ExitCode)" }

      - name: Build and test Parser V1 + Parser V2 runtimes
        shell: powershell
        run: |
          $args = @('-Config', '${{ inputs.config }}', '-Platform', '${{ inputs.platform }}')
          if ('${{ inputs.live_nats }}' -eq 'true') { $args += '-LiveNats' }
          if ('${{ inputs.benchmark }}' -eq 'true') { $args += '-Benchmark' }
          & .\scripts\validate-parser-cutover.ps1 @args
          if ($LASTEXITCODE -ne 0) { throw "Parser cutover validation failed with exit code $LASTEXITCODE" }

      - name: Stop NATS Server
        if: ${{ always() && inputs.live_nats }}
        shell: powershell
        run: |
          if ($env:DEXT_NATS_SERVER_PID) {
            Stop-Process -Id ([int]$env:DEXT_NATS_SERVER_PID) -Force -ErrorAction SilentlyContinue
          }
