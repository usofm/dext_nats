# Structure checks (no Delphi compiler on hosted runners).
# Full Delphi compile/test can run on the manual self-hosted Windows workflow.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required source and docs
        run: |
          set -e
          test -f Source/Dext.Net.Nats.pas
          test -f Source/Dext.Net.Nats.Protocol.pas
          test -f Source/Dext.Net.Nats.NKeys.pas
          test -f Source/Dext.Net.Nats.Dispatching.pas
          test -f Source/Dext.Net.Nats.JetStream.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Json.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Codecs.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Parsers.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Paging.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Transport.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Streams.pas
          test -f Source/JetStream/Dext.Net.Nats.JetStream.Consumers.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Json.Tests.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Streams.Tests.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Consumers.Tests.pas
          test -f Source/Internal/Dext.Net.Nats.Internal.Buffer.pas
          test -f Source/Internal/Dext.Net.Nats.Internal.Dispatcher.pas
          test -f Source/Internal/Dext.Net.Nats.Internal.Parser.pas
          test -f Tests/Protocol/Dext.Net.Nats.ParserV2.Tests.pas
          test -f Tests/Benchmarks/Dext.Net.Nats.ParserV2.Benchmarks.pas
          test -f Tests/Dext.Net.Nats.Tests.dproj
          test -f Docs/ARCHITECTURE_V2.md
          test -f scripts/build-tests.ps1
          test -f .github/workflows/delphi-build.yml
          grep -q 'TDextNatsFrameParserV2' Source/Internal/Dext.Net.Nats.Internal.Parser.pas
          grep -q 'TDextNatsDispatchedSubscription' Source/Dext.Net.Nats.Dispatching.pas
          grep -q 'NatsJsEncodeStreamConfig' Source/JetStream/Dext.Net.Nats.JetStream.Codecs.pas
          grep -q 'NatsJsParseStreamInfo' Source/JetStream/Dext.Net.Nats.JetStream.Parsers.pas
          grep -q 'NatsJsParseNamePage' Source/JetStream/Dext.Net.Nats.JetStream.Paging.pas
          grep -q 'INatsJetStreamApiTransport' Source/JetStream/Dext.Net.Nats.JetStream.Transport.pas
          grep -q 'TDextNatsJetStreamStreams' Source/JetStream/Dext.Net.Nats.JetStream.Streams.pas
          grep -q 'ListStreamNames' Source/JetStream/Dext.Net.Nats.JetStream.Streams.pas
          grep -q 'TDextNatsJetStreamConsumers' Source/JetStream/Dext.Net.Nats.JetStream.Consumers.pas
          grep -q 'ListConsumerNames' Source/JetStream/Dext.Net.Nats.JetStream.Consumers.pas
          grep -q 'TDextNatsJetStreamStreamsTests' Tests/Dext.Net.Nats.Tests.dpr
          grep -q 'TDextNatsJetStreamConsumersTests' Tests/Dext.Net.Nats.Tests.dpr

      - name: Test layout guard
        run: |
          set -e
          test -f Tests/Core/Dext.Net.Nats.Drain.Tests.pas
          test -f Tests/Core/Dext.Net.Nats.Dispatching.Tests.pas
          test -f Tests/Internal/Dext.Net.Nats.Internal.Tests.pas
          test -f Tests/Protocol/Dext.Net.Nats.ParserV2.Tests.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Json.Tests.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Streams.Tests.pas
          test -f Tests/JetStream/Dext.Net.Nats.JetStream.Consumers.Tests.pas
          test -f Tests/Benchmarks/Dext.Net.Nats.ParserV2.Benchmarks.pas

      - name: Repository hygiene
        run: |
          set -e
          if find .tools -type f ! -name README.md | grep -q .; then
            echo "Downloaded/binary tools must not be committed under .tools/."
            exit 1
          fi
          if find . -type f \( -name '*.zip' -o -name '*.7z' \) | grep -q .; then
            echo "Archive artifacts must be downloaded by scripts, not committed."
            exit 1
          fi

      - name: Remind Delphi build is self-hosted
        run: |
          echo "Hosted CI performs structure/hygiene checks only."
          echo "Compile locally or use the manual Delphi Build workflow on a Windows self-hosted runner."
