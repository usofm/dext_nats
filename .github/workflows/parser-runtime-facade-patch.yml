name: Parser Runtime Facade Patch

on:
  push:
    branches:
      - perf/parser-v2-cutover

permissions:
  contents: write

jobs:
  patch-client:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Wire client through root runtime facade
        shell: python
        run: |
          from pathlib import Path
          path = Path('Source/Dext.Net.Nats.pas')
          text = path.read_text(encoding='utf-8-sig')
          replacements = [
              ('Dext.Net.Nats.Internal.ParserSelector;', 'Dext.Net.Nats.ParserRuntime;'),
              ('FParser: TDextNatsSelectedFrameParser;', 'FParser: TDextNatsRuntimeFrameParser;'),
              ('FParser := TDextNatsSelectedFrameParser.Create;', 'FParser := TDextNatsRuntimeFrameParser.Create;'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8-sig')

      - name: Commit runtime facade wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Dext.Net.Nats.pas
          git commit -m 'Route client parser through root runtime facade'
          git push origin HEAD:perf/parser-v2-cutover
