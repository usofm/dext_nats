name: Protocol Runtime Cutover

on:
  push:
    branches: [perf/parser-v2-cutover]

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Cut runtime to specialized protocol units
        shell: python
        run: |
          from pathlib import Path
          p = Path('Source/Dext.Net.Nats.pas')
          s = p.read_text(encoding='utf-8-sig')
          old = '  Dext.Net.Security.OpenSSL,\n  Dext.Telemetry.Metrics,\n  Dext.Net.Nats.Protocol.Writer;'
          new = '  Dext.Net.Security.OpenSSL,\n  Dext.Telemetry.Metrics,\n  Dext.Net.Nats.Protocol.Writer,\n  Dext.Net.Nats.Protocol.Control;'
          if old not in s:
              raise SystemExit('Runtime implementation uses anchor missing')
          s = s.replace(old, new, 1)
          pairs = [
            ('NatsEncodePing', 'NatsControlPing'),
            ('NatsEncodePong', 'NatsControlPong'),
            ('NatsEncodeSub(', 'NatsControlSub('),
            ('NatsEncodeUnsub(', 'NatsControlUnsub('),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'Expected runtime token missing: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8-sig')

      - name: Inspect remaining legacy protocol encoders
        run: |
          grep -RIn --exclude-dir=.git -E 'NatsEncode(Connect|Pub|HPub|Sub|Unsub|Ping|Pong)' Source Tests || true
          grep -q 'NatsV2EncodeConnect(connOpts)' Source/Dext.Net.Nats.pas
          grep -q 'NatsV2EncodePub(ASubject, AReplyTo, APayload)' Source/Dext.Net.Nats.pas
          grep -q 'NatsV2EncodeHPub(ASubject, AReplyTo, AHeaders, APayload)' Source/Dext.Net.Nats.pas
          grep -q 'NatsControlSub(' Source/Dext.Net.Nats.pas
          grep -q 'NatsControlUnsub(' Source/Dext.Net.Nats.pas
          grep -q 'NatsControlPing' Source/Dext.Net.Nats.pas
          grep -q 'NatsControlPong' Source/Dext.Net.Nats.pas

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Dext.Net.Nats.pas
          git commit -m 'Cut runtime control frames over to protocol units'
          git push origin HEAD:perf/parser-v2-cutover
