name: Core Handler Dispatch

on:
  push:
    branches: [perf/parser-v2-cutover]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Move subscription handlers off RecvLoop
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Source/Dext.Net.Nats.pas')
          s = p.read_text(encoding='utf-8-sig')

          old = '  Dext.Net.Nats.NKeys,\n  Dext.Net.Nats.ParserRuntime;'
          new = '  Dext.Net.Nats.NKeys,\n  Dext.Net.Nats.ParserRuntime,\n  Dext.Net.Nats.Internal.Dispatcher;'
          if old not in s:
              raise SystemExit('Interface uses anchor missing')
          s = s.replace(old, new, 1)

          old = '  TNatsRequestTimeoutHandler = reference to procedure;\n\n  /// <summary>Process-local counters'
          new = '''  TNatsRequestTimeoutHandler = reference to procedure;\n\n  /// <summary>Internal work item queued from RecvLoop to subscription workers.</summary>\n  TNatsHandlerDispatchItem = record\n    Handler: TNatsMsgHandler;\n    Msg: TNatsMsg;\n  end;\n\n  /// <summary>Process-local counters'''
          if old not in s:
              raise SystemExit('Handler type anchor missing')
          s = s.replace(old, new, 1)

          old = '    /// <summary>Upper bound, in bytes, for outgoing data buffered while a reconnect is in progress.</summary>\n    MaxPendingBufferBytes: Int64;\n'
          new = '''    /// <summary>Upper bound, in bytes, for outgoing data buffered while a reconnect is in progress.</summary>\n    MaxPendingBufferBytes: Int64;\n    /// <summary>Subscription callback worker count. Default 1 preserves global delivery order.</summary>\n    HandlerWorkerCount: Integer;\n    /// <summary>Bounded callback queue capacity. When full, RecvLoop applies backpressure instead of dropping messages.</summary>\n    HandlerQueueCapacity: Integer;\n'''
          if old not in s:
              raise SystemExit('Options field anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              '  ///   NATS client. Thread-safe: Publish/Subscribe/Request/Flush may be called\n  ///   from any thread while message handlers run on an internal receive thread.\n',
              '  ///   NATS client. Thread-safe: Publish/Subscribe/Request/Flush may be called\n  ///   from any thread. RecvLoop parses frames and enqueues subscription callbacks\n  ///   onto a bounded Dext-channel worker dispatcher.\n',
              1)

          old = '    FParser: TDextNatsRuntimeFrameParser;\n    FOptions: TDextNatsOptions;'
          new = '    FParser: TDextNatsRuntimeFrameParser;\n    FHandlerDispatcher: TDextNatsBoundedDispatcher<TNatsHandlerDispatchItem>;\n    FOptions: TDextNatsOptions;'
          if old not in s:
              raise SystemExit('Client field anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              '    /// <summary>Handlers currently executing on the receive thread; Drain waits for this to reach 0.</summary>\n    FInFlightHandlers: Integer;',
              '    /// <summary>Handlers queued or executing on callback workers; Drain waits for this to reach 0.</summary>\n    FInFlightHandlers: Integer;',
              1)

          old = '    procedure HandleFrame(const AFrame: TNatsFrame);\n    procedure HandleMsgFrame(const AFrame: TNatsFrame);'
          new = '    procedure HandleFrame(const AFrame: TNatsFrame);\n    procedure HandleMsgFrame(const AFrame: TNatsFrame);\n    procedure ExecuteHandlerDispatch(const AItem: TNatsHandlerDispatchItem);\n    procedure HandleDispatcherError(const AError: Exception);'
          if old not in s:
              raise SystemExit('Client method anchor missing')
          s = s.replace(old, new, 1)

          old = '  Result.MaxPendingBufferBytes := 8 * 1024 * 1024;\n  Result.EnableMetrics := False;'
          new = '  Result.MaxPendingBufferBytes := 8 * 1024 * 1024;\n  Result.HandlerWorkerCount := 1;\n  Result.HandlerQueueCapacity := 8192;\n  Result.EnableMetrics := False;'
          if old not in s:
              raise SystemExit('Default options anchor missing')
          s = s.replace(old, new, 1)

          old = '''  FSubscriptions := TCollections.CreateDictionary<Integer, TDextNatsSubscription>(True);\n  FPongWaiters := TCollections.CreateQueue<TEvent>;\n  FPendingOutbox := TCollections.CreateQueue<TBytes>;\nend;'''
          new = '''  FSubscriptions := TCollections.CreateDictionary<Integer, TDextNatsSubscription>(True);\n  FPongWaiters := TCollections.CreateQueue<TEvent>;\n  FPendingOutbox := TCollections.CreateQueue<TBytes>;\n\n  if FOptions.HandlerWorkerCount <= 0 then\n    raise EArgumentOutOfRangeException.Create('HandlerWorkerCount must be > 0');\n  if FOptions.HandlerQueueCapacity <= 0 then\n    raise EArgumentOutOfRangeException.Create('HandlerQueueCapacity must be > 0');\n  FHandlerDispatcher := TDextNatsBoundedDispatcher<TNatsHandlerDispatchItem>.Create(\n    FOptions.HandlerWorkerCount, FOptions.HandlerQueueCapacity,\n    ExecuteHandlerDispatch, dopBlock);\n  FHandlerDispatcher.OnError := HandleDispatcherError;\nend;'''
          if old not in s:
              raise SystemExit('Constructor queue anchor missing')
          s = s.replace(old, new, 1)

          old = '''  Disconnect;\n  ResetTls;\n  FTlsIoLock.Free;'''
          new = '''  Disconnect;\n  FreeAndNil(FHandlerDispatcher);\n  ResetTls;\n  FTlsIoLock.Free;'''
          if old not in s:
              raise SystemExit('Destructor anchor missing')
          s = s.replace(old, new, 1)

          # Do not reset the count on reconnect/manual reconnect: queued callbacks from a
          # previous socket generation still count as in-flight until completed.
          s = s.replace('  TInterlocked.Exchange(FInFlightHandlers, 0);\n\n  ResetTls;', '  ResetTls;', 1)

          pattern = r"procedure TDextNatsClient\.HandleMsgFrame\(const AFrame: TNatsFrame\);\n.*?\nend;\n\nprocedure TDextNatsClient\.DispatchOutgoing"
          replacement = '''procedure TDextNatsClient.HandleMsgFrame(const AFrame: TNatsFrame);\nvar\n  sub: TDextNatsSubscription;\n  msg: TNatsMsg;\n  item: TNatsHandlerDispatchItem;\n  found, removeAfter: Boolean;\n  handler: TNatsMsgHandler;\nbegin\n  found := False;\n  removeAfter := False;\n  handler := nil;\n\n  FLock.Enter;\n  try\n    found := FSubscriptions.TryGetValue(AFrame.Sid, sub);\n    if found then\n    begin\n      Inc(sub.Received);\n      handler := sub.Handler;\n      if (sub.MaxMsgs >= 0) and (sub.Received >= sub.MaxMsgs) then\n        removeAfter := True;\n    end;\n  finally\n    FLock.Leave;\n  end;\n\n  if not found then\n    Exit;\n\n  msg.Subject := AFrame.Subject;\n  msg.ReplyTo := AFrame.ReplyTo;\n  msg.Payload := AFrame.Payload;\n  msg.Headers := AFrame.Headers;\n  msg.Sid := AFrame.Sid;\n  msg.StatusCode := AFrame.StatusCode;\n\n  NoteMetric(NATS_METRIC_MSGS_RECEIVED, FMetricMessagesReceived);\n\n  if Assigned(handler) then\n  begin\n    item.Handler := handler;\n    item.Msg := msg;\n    TInterlocked.Increment(FInFlightHandlers);\n    try\n      FHandlerDispatcher.Dispatch(item);\n    except\n      TInterlocked.Decrement(FInFlightHandlers);\n      raise;\n    end;\n  end;\n\n  // Server-side MaxMsgs semantics are based on messages received, not callback\n  // completion, so local interest can be removed immediately after enqueue.\n  if removeAfter then\n  begin\n    FLock.Enter;\n    try\n      FSubscriptions.Remove(AFrame.Sid);\n    finally\n      FLock.Leave;\n    end;\n  end;\nend;\n\nprocedure TDextNatsClient.ExecuteHandlerDispatch(const AItem: TNatsHandlerDispatchItem);\nbegin\n  try\n    try\n      AItem.Handler(AItem.Msg);\n    except\n      on E: Exception do\n        FireError('Unhandled exception in NATS message handler for subject "' +\n          AItem.Msg.Subject + '": ' + E.Message);\n    end;\n  finally\n    TInterlocked.Decrement(FInFlightHandlers);\n  end;\nend;\n\nprocedure TDextNatsClient.HandleDispatcherError(const AError: Exception);\nbegin\n  FireError('NATS handler dispatcher error: ' + AError.Message);\nend;\n\nprocedure TDextNatsClient.DispatchOutgoing'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one HandleMsgFrame block, replaced {count}')

          s = s.replace(
              '/// <summary>Non-blocking request/reply: AOnReply fires on the receive thread when a reply arrives;',
              '/// <summary>Non-blocking request/reply: AOnReply fires on a callback worker when a reply arrives;',
              1)

          p.write_text(s, encoding='utf-8-sig')

      - name: Enforce receive-thread separation
        run: |
          grep -q 'FHandlerDispatcher: TDextNatsBoundedDispatcher<TNatsHandlerDispatchItem>' Source/Dext.Net.Nats.pas
          grep -q 'HandlerWorkerCount := 1' Source/Dext.Net.Nats.pas
          grep -q 'HandlerQueueCapacity := 8192' Source/Dext.Net.Nats.pas
          grep -q 'FHandlerDispatcher.Dispatch(item)' Source/Dext.Net.Nats.pas
          grep -q 'procedure TDextNatsClient.ExecuteHandlerDispatch' Source/Dext.Net.Nats.pas
          grep -q 'FreeAndNil(FHandlerDispatcher)' Source/Dext.Net.Nats.pas
          python - <<'PY'
          from pathlib import Path
          s = Path('Source/Dext.Net.Nats.pas').read_text(encoding='utf-8-sig')
          a = s.index('procedure TDextNatsClient.HandleMsgFrame')
          b = s.index('procedure TDextNatsClient.ExecuteHandlerDispatch', a)
          block = s[a:b]
          assert 'handler(msg);' not in block
          assert 'FHandlerDispatcher.Dispatch(item)' in block
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Dext.Net.Nats.pas
          git commit -m 'Move subscription callbacks off RecvLoop'
          git push origin HEAD:perf/parser-v2-cutover
