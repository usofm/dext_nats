name: Core Handler Dispatch

on:
  push:
    branches: [perf/parser-v2-cutover]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Keep only synchronous request completion inline
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Source/Dext.Net.Nats.pas')
          s = p.read_text(encoding='utf-8-sig')

          old = '''    Handler: TNatsMsgHandler;\n    /// <summary>Absolute message count after which the subscription auto-cancels; -1 means unlimited.</summary>\n    MaxMsgs: Integer;\n    Received: Integer;\n    constructor Create(ASid: Integer; const ASubject, AQueue: string; AHandler: TNatsMsgHandler);'''
          new = '''    Handler: TNatsMsgHandler;\n    /// <summary>True only for tiny internal synchronous-request completion handlers.</summary>\n    InlineDelivery: Boolean;\n    /// <summary>Absolute message count after which the subscription auto-cancels; -1 means unlimited.</summary>\n    MaxMsgs: Integer;\n    Received: Integer;\n    constructor Create(ASid: Integer; const ASubject, AQueue: string; AHandler: TNatsMsgHandler;\n      AInlineDelivery: Boolean = False);'''
          if old not in s:
              raise SystemExit('Subscription declaration anchor missing')
          s = s.replace(old, new, 1)

          old = '''    function GetMetrics: TNatsClientMetrics;\n    function NextSid: Integer;'''
          new = '''    function GetMetrics: TNatsClientMetrics;\n    function NextSid: Integer;\n    function SubscribeCore(const ASubject: string; const AHandler: TNatsMsgHandler;\n      const AQueue: string; AInlineDelivery: Boolean): Integer;'''
          if old not in s:
              raise SystemExit('SubscribeCore declaration anchor missing')
          s = s.replace(old, new, 1)

          old = '''constructor TDextNatsSubscription.Create(ASid: Integer; const ASubject, AQueue: string; AHandler: TNatsMsgHandler);\nbegin\n  inherited Create;\n  Sid := ASid;\n  Subject := ASubject;\n  Queue := AQueue;\n  Handler := AHandler;\n  MaxMsgs := -1;\n  Received := 0;\nend;'''
          new = '''constructor TDextNatsSubscription.Create(ASid: Integer; const ASubject, AQueue: string;\n  AHandler: TNatsMsgHandler; AInlineDelivery: Boolean);\nbegin\n  inherited Create;\n  Sid := ASid;\n  Subject := ASubject;\n  Queue := AQueue;\n  Handler := AHandler;\n  InlineDelivery := AInlineDelivery;\n  MaxMsgs := -1;\n  Received := 0;\nend;'''
          if old not in s:
              raise SystemExit('Subscription constructor anchor missing')
          s = s.replace(old, new, 1)

          # Replace public Subscribe body with a tiny delegation and introduce SubscribeCore.
          pattern = r"function TDextNatsClient\.Subscribe\(const ASubject: string; const AHandler: TNatsMsgHandler;\n  const AQueue: string\): Integer;\nvar\n  sub: TDextNatsSubscription;\n  sendNow: Boolean;\nbegin\n.*?\n  Result := sub\.Sid;\nend;"
          replacement = '''function TDextNatsClient.Subscribe(const ASubject: string; const AHandler: TNatsMsgHandler;\n  const AQueue: string): Integer;\nbegin\n  Result := SubscribeCore(ASubject, AHandler, AQueue, False);\nend;\n\nfunction TDextNatsClient.SubscribeCore(const ASubject: string; const AHandler: TNatsMsgHandler;\n  const AQueue: string; AInlineDelivery: Boolean): Integer;\nvar\n  sub: TDextNatsSubscription;\n  sendNow: Boolean;\nbegin\n  if ASubject = '' then\n    raise EDextNatsException.Create('Subscribe requires a non-empty subject');\n  if not Assigned(AHandler) then\n    raise EDextNatsException.Create('Subscribe requires a message handler');\n\n  sub := TDextNatsSubscription.Create(NextSid, ASubject, AQueue, AHandler, AInlineDelivery);\n\n  FLock.Enter;\n  try\n    if FDraining or FClosing then\n    begin\n      sub.Free;\n      raise EDextNatsException.Create('Subscribe rejected: NATS client is draining or closing');\n    end;\n    FSubscriptions.Add(sub.Sid, sub);\n    sendNow := FConnected;\n  finally\n    FLock.Leave;\n  end;\n\n  if sendNow then\n    SendRaw(NatsControlSub(ASubject, AQueue, sub.Sid));\n\n  Result := sub.Sid;\nend;'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one Subscribe body, replaced {count}')

          # Capture inline flag while the subscription object is protected by the map lock.
          s = s.replace(
              '  found, removeAfter: Boolean;\n  handler: TNatsMsgHandler;',
              '  found, removeAfter, inlineDelivery: Boolean;\n  handler: TNatsMsgHandler;',
              1)
          s = s.replace(
              '  removeAfter := False;\n  handler := nil;',
              '  removeAfter := False;\n  inlineDelivery := False;\n  handler := nil;',
              1)
          s = s.replace(
              '      Inc(sub.Received);\n      handler := sub.Handler;',
              '      Inc(sub.Received);\n      handler := sub.Handler;\n      inlineDelivery := sub.InlineDelivery;',
              1)

          old = '''    TInterlocked.Increment(FInFlightHandlers);\n    try\n      FHandlerDispatcher.Dispatch(item);\n    except\n      TInterlocked.Decrement(FInFlightHandlers);\n      raise;\n    end;'''
          new = '''    TInterlocked.Increment(FInFlightHandlers);\n    try\n      if inlineDelivery then\n        ExecuteHandlerDispatch(item)\n      else\n        FHandlerDispatcher.Dispatch(item);\n    except\n      // ExecuteHandlerDispatch owns the decrement once it starts. Dispatch only\n      // raises before ownership is transferred to a worker.\n      if not inlineDelivery then\n        TInterlocked.Decrement(FInFlightHandlers);\n      raise;\n    end;'''
          if old not in s:
              raise SystemExit('HandleMsgFrame dispatch anchor missing')
          s = s.replace(old, new, 1)

          # Synchronous Request waits on an event. Its tiny completion callback must not
          # sit behind the same worker that may be blocked inside Request().
          old = '''    sid := Subscribe(inbox,\n      procedure(const AMsg: TNatsMsg)\n      begin\n        // Only touch `reply`/`evt` after winning the gate, so that once the timeout path below\n        // claims it first, the handler is guaranteed never to touch either afterwards - this is\n        // what makes it safe for the timeout path to free `evt` right after claiming the gate.\n        if gate.TryClaim then\n        begin\n          reply := AMsg;\n          evt.SetEvent;\n        end;\n      end);'''
          new = '''    sid := SubscribeCore(inbox,\n      procedure(const AMsg: TNatsMsg)\n      begin\n        // Internal completion only: signal the synchronous waiter immediately on\n        // RecvLoop so Request() remains safe even when called from the sole callback worker.\n        if gate.TryClaim then\n        begin\n          reply := AMsg;\n          evt.SetEvent;\n        end;\n      end, '', True);'''
          if old not in s:
              raise SystemExit('Synchronous Request subscription anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8-sig')

      - name: Enforce nested Request safety
        run: |
          grep -q 'InlineDelivery: Boolean' Source/Dext.Net.Nats.pas
          grep -q 'Result := SubscribeCore(ASubject, AHandler, AQueue, False)' Source/Dext.Net.Nats.pas
          grep -q "end, '', True);" Source/Dext.Net.Nats.pas
          grep -q 'if inlineDelivery then' Source/Dext.Net.Nats.pas
          grep -q 'ExecuteHandlerDispatch(item)' Source/Dext.Net.Nats.pas
          grep -q 'FHandlerDispatcher.Dispatch(item)' Source/Dext.Net.Nats.pas
          python - <<'PY'
          from pathlib import Path
          s = Path('Source/Dext.Net.Nats.pas').read_text(encoding='utf-8-sig')
          req = s[s.index('function TDextNatsClient.RequestWithHeaders'):s.index('procedure TDextNatsClient.RequestAsync', s.index('function TDextNatsClient.RequestWithHeaders'))]
          assert 'SubscribeCore(inbox' in req and "end, '', True);" in req
          pub = s[s.index('function TDextNatsClient.Subscribe('):s.index('function TDextNatsClient.SubscribeCore', s.index('function TDextNatsClient.Subscribe('))]
          assert 'False' in pub
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Dext.Net.Nats.pas
          git commit -m 'Keep synchronous request completion off callback queue'
          git push origin HEAD:perf/parser-v2-cutover
