name: Wire Protocol Writer

on:
  push:
    branches:
      - perf/parser-v2-cutover

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/parser-v2-cutover
          fetch-depth: 0

      - name: Wire V2 writer and release outbox state lock before network I/O
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Source/Dext.Net.Nats.pas')
          s = p.read_text(encoding='utf-8-sig')

          old_uses = "implementation\n\nuses\n  Dext.Net.Security.OpenSSL,\n  Dext.Telemetry.Metrics;"
          new_uses = "implementation\n\nuses\n  Dext.Net.Security.OpenSSL,\n  Dext.Telemetry.Metrics,\n  Dext.Net.Nats.Protocol.Writer;"
          if old_uses not in s:
              raise SystemExit('Implementation uses anchor not found')
          s = s.replace(old_uses, new_uses, 1)

          replacements = [
              ('SendRaw(NatsEncodeConnect(connOpts));', 'SendRaw(NatsV2EncodeConnect(connOpts));'),
              ('DispatchOutgoing(NatsEncodePub(ASubject, AReplyTo, APayload));', 'DispatchOutgoing(NatsV2EncodePub(ASubject, AReplyTo, APayload));'),
              ('DispatchOutgoing(NatsEncodeHPub(ASubject, AReplyTo, AHeaders, APayload));', 'DispatchOutgoing(NatsV2EncodeHPub(ASubject, AReplyTo, AHeaders, APayload));'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Runtime writer anchor missing: {old}')
              s = s.replace(old, new, 1)

          pattern = r"procedure TDextNatsClient\.FlushOutbox;\nvar\n  data: TBytes;\nbegin\n  FLock\.Enter;\n  try\n    while FPendingOutbox\.Count > 0 do\n    begin\n      data := FPendingOutbox\.Dequeue;\n      Dec\(FPendingOutboxBytes, Length\(data\)\);\n      SendRaw\(data\);\n    end;\n  finally\n    FLock\.Leave;\n  end;\nend;"
          replacement = "procedure TDextNatsClient.FlushOutbox;\nvar\n  data: TBytes;\n  hasData: Boolean;\nbegin\n  // Never hold the shared client-state lock across socket/TLS I/O. Dequeue one\n  // frame at a time under FLock, then send it under the dedicated send lock.\n  // FIFO ordering is preserved because this routine is the sole outbox drainer.\n  while True do\n  begin\n    FLock.Enter;\n    try\n      hasData := FPendingOutbox.Count > 0;\n      if hasData then\n      begin\n        data := FPendingOutbox.Dequeue;\n        Dec(FPendingOutboxBytes, Length(data));\n      end;\n    finally\n      FLock.Leave;\n    end;\n\n    if not hasData then\n      Break;\n    SendRaw(data);\n  end;\nend;"
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one FlushOutbox implementation, replaced {count}')

          p.write_text(s, encoding='utf-8-sig')

      - name: Runtime writer contract
        run: |
          grep -q 'Dext.Net.Nats.Protocol.Writer' Source/Dext.Net.Nats.pas
          grep -q 'NatsV2EncodeConnect(connOpts)' Source/Dext.Net.Nats.pas
          grep -q 'NatsV2EncodePub(ASubject, AReplyTo, APayload)' Source/Dext.Net.Nats.pas
          grep -q 'NatsV2EncodeHPub(ASubject, AReplyTo, AHeaders, APayload)' Source/Dext.Net.Nats.pas
          grep -q 'hasData := FPendingOutbox.Count > 0' Source/Dext.Net.Nats.pas
          echo 'Remaining legacy encoder references:'
          grep -RIn --exclude-dir=.git -E 'NatsEncodeConnect|NatsEncodePub|NatsEncodeHPub' Source Tests || true

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Dext.Net.Nats.pas
          git commit -m 'Wire runtime publish path to protocol writer V2'
          git push origin HEAD:perf/parser-v2-cutover
