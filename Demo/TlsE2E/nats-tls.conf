# TLS-only NATS for Demo/TlsE2E (same fixtures as Tests/tls).
# Cleartext / JetStream demos stay on 4222; this listener is TLS on 4223.
#
# Start from the repository root (nats-server resolves cert paths relative
# to this config file directory):
#
#   nats-server -c Demo/TlsE2E/nats-tls.conf
#
# Equivalent fixture-only form (cwd must be Tests/tls):
#
#   cd Tests/tls
#   nats-server -c nats-tls.conf

port: 4223
http: 8223
server_name: dext-nats-tls-e2e
tls {
  cert_file: "../../Tests/tls/server-cert.pem"
  key_file: "../../Tests/tls/server-key.pem"
  timeout: 5
}